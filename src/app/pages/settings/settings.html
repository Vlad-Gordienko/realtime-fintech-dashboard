<form class="settings-form" [formRoot]="form" (submit)="apply()">
  <numeric-field [formField]="form.instrumentCount" label="Instrument count" />
  <numeric-field [formField]="form.updatesPerBatch" label="Updates per batch" />
  <numeric-field [formField]="form.batchIntervalMs" label="Batch interval (ms)" />

  <button type="submit" [disabled]="!isValid()">Apply</button>
</form>
